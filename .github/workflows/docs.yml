# Builds the Sphinx docs from this branch against the package source on main,
# and publishes the HTML to the gh-pages branch. Runs on every push to docs,
# and can be triggered by hand after a main push.
name: docs

on:
  push:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # this branch: docs source
      - uses: actions/checkout@v4            # main: package source for autodoc
        with:
          ref: main
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./src -r docs/requirements.txt
      - run: sphinx-build -W -b html docs docs/_build/html
      - run: touch docs/_build/html/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
