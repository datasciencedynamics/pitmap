[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitmap"
version = "0.0.0a1"
description = "Surface construction from scattered survey points for open-pit mine surveying: polygonal, sector IDW, polynomial, NURBS and kernel interpolators, with prism volumes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Leonid Shpaner"}]
keywords = ["mine surveying", "interpolation", "open-pit", "NURBS", "IDW", "surface modeling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/datasciencedynamics/pitmap"
Repository = "https://github.com/datasciencedynamics/pitmap"

[project.optional-dependencies]
kernel = ["scikit-learn>=1.3"]
nurbs = ["geomdl>=5.3"]
data = ["pandas>=2.0", "pyarrow>=14", "rasterio>=1.3", "typer>=0.9"]
viz = ["matplotlib>=3.7"]
dev = ["pytest", "black", "nbstripout", "jupyter", "build", "twine"]

[tool.setuptools.packages.find]
include = ["pitmap*"]

[tool.black]
line-length = 88
