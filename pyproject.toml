[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitsurf"
version = "0.0.0a1"
description = "Surface construction from scattered survey points: polygonal (nearest-region), B-spline, NURBS, and SVR interpolators for open-pit mine surveying."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Leonid Shpaner"}]
keywords = ["mine surveying", "interpolation", "open-pit", "NURBS", "IDW", "surface modeling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/lshpaner/pitsurf"
Repository = "https://github.com/lshpaner/pitsurf"

[project.optional-dependencies]
kernel = ["scikit-learn>=1.3"]
nurbs = ["geomdl>=5.3"]
data = ["pandas>=2.0", "pyarrow>=14", "rasterio>=1.3", "typer>=0.9"]
viz = ["matplotlib>=3.7"]
dev = ["pytest", "black", "nbstripout", "jupyter", "build", "twine"]

[tool.setuptools.packages.find]
include = ["pitsurf*"]

[tool.black]
line-length = 88
